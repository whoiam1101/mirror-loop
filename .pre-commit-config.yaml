minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]
fail_fast: false
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (full git history)
        entry: gitleaks git --redact --verbose
        stages: [pre-commit, pre-push]
        always_run: true

  - repo: local
    hooks:
      - id: forbid-suppressions
        name: forbid lint and type suppressions
        description: "Allows only rule-specific ty ignores"
        language: pygrep
        entry: '#\s*(?:noqa|type:\s*ignore|pyright:|mypy:)|#\s*ty:\s*ignore(?!\[)'
        types: [python]

      - id: forbid-any
        name: forbid Any
        language: pygrep
        entry: '\bAny\b'
        types: [python]

      - id: forbid-skipped-tests
        name: forbid skipped and xfail tests
        language: pygrep
        entry: 'pytest\.(?:mark\.(?:skip|skipif|xfail)|skip\(|xfail\()'
        files: ^(tests|benchmarks)/
        types: [python]

      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        types_or: [python, pyi]
        require_serial: true

      - id: ty
        name: ty check
        language: system
        entry: uv run ty check --error-on-warning
        files: \.(py|pyi|toml|lock)$
        pass_filenames: false
        require_serial: true

      - id: pytest
        name: pytest
        language: system
        entry: uv run pytest -x -q
        files: \.(py|pyi|toml|lock)$
        pass_filenames: false
        require_serial: true

      - id: make-check
        name: make check
        language: system
        entry: make check
        stages: [pre-commit, pre-push]
        always_run: true
        pass_filenames: false
        require_serial: true
